<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Box</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <!-- Nav tabs (Tab buttons) -->
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons (optional for arrow icons) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<div class="d-flex flex-column align-items-center bg-light p-4 rounded">
  <!-- Image Frame -->
  <div class="border border-primary p-2 mb-3" style="background-color: #f8faff;">
    <img id="productImage" src="images/sensible angle 1.png" alt="Product" class="img-fluid" style="max-width: 400px;">
  </div>

  <!-- Navigation Buttons -->
  <div class="d-flex gap-3">
    <button class="btn btn-outline-primary" onclick="showPrevImage()">
      <i class="bi bi-arrow-left"><img src="" alt=""></i>
    </button>
    <button class="btn btn-outline-primary" onclick="showNextImage()">
      <i class="bi bi-arrow-up-right"></i>
    </button>
  </div>
</div>

<!-- Optional: Script for image navigation -->
<script>
  const images = ["sensible angle 1.png", "sensible angle 2.png", "sensible angle 3.png", "sensible angle 4.png"]; // Add your image filenames
  let currentIndex = 0;

  function showImage(index) {
    document.getElementById('productImage').src = images[index];
  }

  function showPrevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    showImage(currentIndex);
  }

  function showNextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    showImage(currentIndex);
  }
</script>




</body>
</html>
