<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Box</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Nav tabs (Tab buttons) -->
<ul class="nav nav-tabs mb-3" id="imageTab" role="tablist">
  <li class="nav-item" role="presentation">
    <button class="nav-link active" id="img1-tab" data-bs-toggle="tab" data-bs-target="#img1" type="button" role="tab">Image 1</button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link" id="img2-tab" data-bs-toggle="tab" data-bs-target="#img2" type="button" role="tab">Image 2</button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link" id="img3-tab" data-bs-toggle="tab" data-bs-target="#img3" type="button" role="tab">Image 3</button>
  </li>
</ul>

<!-- Tab content (Images that change) -->
<div class="tab-content">
  <div class="tab-pane fade show active" id="img1" role="tabpanel">
    <img src="images/image1.jpg" alt="Image 1" class="img-fluid">
  </div>
  <div class="tab-pane fade" id="img2" role="tabpanel">
    <img src="images/image2.jpg" alt="Image 2" class="img-fluid">
  </div>
  <div class="tab-pane fade" id="img3" role="tabpanel">
    <img src="images/image3.jpg" alt="Image 3" class="img-fluid">
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
